# =============================================================================
# nginx na frente de TODO o sistema.
#   - HTTPS (443) único ponto de entrada; proxy para o app Node (app:3000).
#   - mTLS EXIGIDO só na rota /webhook/pix/  (o BB precisa apresentar o cert).
#   - Resto (API JWT, /health): SEM mTLS.
# =============================================================================

upstream rotativo_app {
    server app:3000;
}

# Log com o resultado do mTLS (aparece em: docker compose logs nginx)
#   verify=NONE   -> o BB não mandou certificado de cliente
#   verify=FAILED -> mandou, mas não bate com o bb-ca.pem (CA errada)
#   verify=SUCCESS-> mTLS OK
log_format mtls 'MTLS verify=$ssl_client_verify dn="$ssl_client_s_dn" '
                'issuer="$ssl_client_i_dn" ip=$remote_addr "$request" -> $status';

# HTTP :80 -> desafio do Let's Encrypt (ACME) + redireciona o resto pra HTTPS
server {
    listen 80;
    server_name _;

    # Let's Encrypt (webroot) — precisa responder ANTES do redirect.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name _;

    # --- TLS do SERVIDOR (seu domínio) ---------------------------------------
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # --- mTLS OPCIONAL no servidor -------------------------------------------
    # bb-ca.pem = cadeia(s) do BB. Para sandbox + produção no mesmo nginx,
    # concatene as duas CAs neste arquivo.
    # 'optional' = valida o cert do cliente SE ele for apresentado, mas NÃO
    # bloqueia a conexão nas outras rotas. O bloqueio real é feito por rota.
    ssl_client_certificate /etc/nginx/certs/bb-ca.pem;
    ssl_verify_client      optional;
    ssl_verify_depth       3;

    # cabeçalhos comuns repassados ao app
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto https;

    # --- WEBHOOK -------------------------------------------------------------
    # O BB NÃO apresenta certificado de cliente (verify=NONE), então NÃO dá para
    # exigir mTLS aqui — isso barraria o próprio BB. A segurança do webhook é
    # feita no app: filtro de IP (range do BB) + token secreto na URL.
    location /webhook/pix/ {
        # Mantém o log do mTLS (mostra verify=NONE) só para auditoria.
        access_log /dev/stdout mtls;

        proxy_pass http://rotativo_app;
        # IMPORTANTE: quando a location define proxy_set_header, ela NÃO herda os
        # do server. Precisamos repetir o IP real aqui, senão o app vê o IP do
        # nginx e o filtro de IP do webhook nunca casa com o range do BB.
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $remote_addr;
        proxy_set_header X-Forwarded-Proto  https;
        # resultado do mTLS pro app (auditoria)
        proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
        proxy_set_header X-SSL-Client-DN     $ssl_client_s_dn;
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
    }

    # --- RESTO DO SISTEMA: sem mTLS (API JWT, /health, etc.) ------------------
    location / {
        proxy_pass http://rotativo_app;
    }
}
