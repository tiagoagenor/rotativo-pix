# =============================================================================
# Gateway mTLS para o webhook PIX do Banco do Brasil
# -----------------------------------------------------------------------------
# Este nginx fica NA FRENTE do webhook (app Laravel no Hostoo, que não permite
# configurar mTLS). Ele TERMINA o TLS, EXIGE e VALIDA o certificado de cliente
# que o BB apresenta (mTLS) contra a cadeia (CA) do BB e só então repassa a
# requisição para o app.
#
# No mTLS do webhook:
#   - O BB é o CLIENTE (apresenta um certificado ao chamar seu endpoint).
#   - Este nginx é o SERVIDOR (valida esse certificado contra a CA do BB).
# =============================================================================

server {
    listen 443 ssl;
    server_name _;

    # --- TLS do SERVIDOR (seu domínio) ---------------------------------------
    # Em teste: server.crt/server.key são self-signed (por isso curl usa -k).
    # Em produção: troque pelo cert do SEU domínio (ex.: Let's Encrypt).
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # --- mTLS: validação do certificado de CLIENTE (o BB) --------------------
    # bb-ca.pem = cadeia (CA) do BB. Em teste é a CA de teste; em produção é a
    # concatenação das cadeias reais do BB (intermediária + raiz).
    ssl_client_certificate /etc/nginx/certs/bb-ca.pem;
    ssl_verify_client      on;      # EXIGE cert de cliente válido
    ssl_verify_depth       3;       # profundidade da cadeia (leaf -> inter -> raiz)

    # Cabeçalhos comuns repassados ao app (defini uma vez, reuso nos locations).
    # Nginx: 'add_header'/'proxy_set_header' não herdam se redefinidos no bloco
    # filho, então repetimos onde necessário.

    # --- Endpoint do webhook -------------------------------------------------
    location /webhook/pix/ {
        # ===================== MODO TESTE (padrão) ===========================
        # Responde 200 provando que o mTLS passou, sem depender do app Laravel.
        default_type text/plain;
        return 200 "mtls-ok cliente=$ssl_client_s_dn verify=$ssl_client_verify\n";

        # ===================== MODO PRODUÇÃO =================================
        # Comente as 2 linhas acima (default_type + return) e descomente abaixo
        # para repassar a requisição ao app Laravel real (Hostoo).
        #
        # proxy_pass https://SEU-APP-PROD.hostoo.app;      # host/URL do app Laravel
        # proxy_set_header Host              SEU-APP-PROD.hostoo.app;
        # proxy_ssl_server_name on;
        #
        # # Repasse do resultado do mTLS + IP de origem para o app validar:
        # proxy_set_header X-Forwarded-For    $remote_addr;
        # proxy_set_header X-Forwarded-Proto  https;
        # proxy_set_header X-Real-IP          $remote_addr;
        # proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
        # proxy_set_header X-SSL-Client-DN     $ssl_client_s_dn;
        # proxy_set_header X-SSL-Client-Issuer $ssl_client_i_dn;
        #
        # proxy_connect_timeout 10s;
        # proxy_read_timeout    30s;
    }

    # Qualquer outra rota: 404 (não expõe nada além do webhook).
    location / {
        return 404;
    }
}
